<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가지마켓 (EggPlant Market)</title>
    <script>
      // 첫 그림이 그려지기 전에 테마를 붙인다. React가 뜬 뒤에 붙이면 다크로 쓰는 사람에게
      // 흰 화면이 한 번 번쩍인다. 키와 값은 src/shared/store/uiStore.ts와 같아야 한다.
      (function applyStoredTheme() {
        try {
          var stored = window.localStorage.getItem('eggplant-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

          // 'light'가 아닌 모르는 값은 '시스템'으로 본다(toThemePreference와 같은 규칙).
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          // 저장소를 읽지 못하면 라이트로 시작한다. 곧 React가 다시 판단한다.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
